<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>인노바드 조회</title>
<meta name="theme-color" content="#1F3864">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인노바드 조회">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  html, body { margin:0; height:100%; background:#1F3864; }
  iframe { position:fixed; inset:0; width:100%; height:100%; border:0; background:#F3F5F9; }
  .msg { color:#fff; font-family:-apple-system,"Malgun Gothic",sans-serif; padding:40px 24px; line-height:1.6; }
</style>
</head>
<body>
<script>
/* ▼▼ 여기에 구글 웹앱 주소(…/exec)를 붙여넣으세요 ▼▼ */
var EXEC_URL = 'https://script.google.com/macros/s/AKfycbwaK3jn2X-0QaOkw9OAh7UCfkDvbxo2v0mv2IAPYahXC-Ijs1I9b6oH3eh-6G2Dxegw/exec';
/* ▲▲ ------------------------------------------- ▲▲ */
if (EXEC_URL.indexOf('/exec') < 0 || EXEC_URL.indexOf('여기에') >= 0) {
  document.body.innerHTML = '<div class="msg">index.html 의 EXEC_URL 에 웹앱 주소를 넣어 주세요.</div>';
} else {
  var f = document.createElement('iframe');
  f.src = EXEC_URL; f.title = '인노바드 재고·배송 조회';
  f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);
}
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
</script>
</body>
</html>
